name: Django CI with PostgreSQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: dbmovies_final
          POSTGRES_USER: django
          POSTGRES_PASSWORD: master
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install psycopg2-binary

      - name: Run Django tests
        env:
          DB_NAME: dbmovies_final
          DB_USER: django
          DB_PASSWORD: master
          DB_HOST: 127.0.0.1  # OJO: localhost puede fallar, mejor usar 127.0.0.1
          DB_PORT: 5432
        run: |
          python manage.py migrate
          python manage.py test


